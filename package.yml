package: sprog
version: '2.0.0-dev'
author: Thomas Blum
supportpage: www.redaxo.org/de/forum/

requires:
    redaxo: '^5.21'
    php: '^8.4'

filter:
    - Sprog\Filter\Format
    - Sprog\Filter\Limit
    - Sprog\Filter\Lower
    - Sprog\Filter\Markdown
    - Sprog\Filter\Raw
    - Sprog\Filter\Title
    - Sprog\Filter\Upper
    - Sprog\Filter\Words

page:
    title: 'translate:sprog'
    perm: sprog[]
    pjax: true
    icon: rex-icon rex-icon-language
    subpages:
        dashboard:
            title: 'translate:sprog_dashboard_subpage'
        inbox:
            title: 'translate:sprog_inbox_subpage'
        create:
            title: 'translate:sprog_create_subpage'
            hidden: true
        glossary:
            title: 'translate:sprog_glossary_subpage'
            perm: admin[]
        datenpflege:
            title: 'translate:sprog_datenpflege_subpage'
            perm: admin[]
            subpages:
                copy_structure_content:
                    title: 'translate:copy_structure_content'
                    subPath: pages/copy.structure_content.php
                copy_structure_metadata:
                    title: 'translate:copy_structure_metadata'
                    subPath: pages/copy.structure_metadata.php
                import:
                    title: 'translate:import'
                    subPath: pages/artefact.import.php
                    pjax: false
                export:
                    title: 'translate:export'
                    subPath: pages/artefact.export.php
                    pjax: false
                migration:
                    title: 'translate:sprog_migration_subpage'
                    subPath: pages/migration.php
        settings:
            title: 'translate:settings'
            perm: admin[]
            subPath: pages/settings.php
        help:
            title: 'translate:help'
            subPath: README.md
            perm: admin[]
            itemClass: pull-right


pages:
    # AJAX-Endpoint des Artikel-Sprachvergleichs (in der Content-Maske
    # eingehängt via STRUCTURE_CONTENT_*-EPs). hasLayout:false → nur der
    # Fragment-/JSON-Output. Rechte werden im Endpoint geprüft (copyContent[]
    # + clang-/Kategorie-Perm), daher hier kein restriktives perm.
    sprog.langcompare:
        title: 'translate:sprog_langcompare_heading'
        main: true
        hasLayout: false
        hidden: true

default_config:
    wildcard_open_tag: '{{ '
    wildcard_close_tag: ' }}'
    chunk_size_articles: 4
    workflow_dev_self_approve: false
